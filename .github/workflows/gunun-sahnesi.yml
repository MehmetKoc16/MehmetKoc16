name: Günün sahnesi

on:
  schedule:
    - cron: "5 21 * * *"   # her gece 00:05 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  degistir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sahneyi seç
        run: python scripts/gunun_sahnesi.py "$(TZ=Europe/Istanbul date +%F)"
      - name: Değiştiyse commit at
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sahneler/gunun-sahnesi.svg README.md
          git diff --cached --quiet || git commit -m "Günün sahnesi: $(date +%F)"
          git push
